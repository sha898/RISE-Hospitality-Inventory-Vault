```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Hospitality Vault</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --accent: #FF4157; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: white;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active { color: var(--accent); }
        .nav-btn.active i { transform: scale(1.1); }

        /* Smooth Transitions */
        .view-content {
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32 overflow-x-hidden">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 px-6 py-6 border-b glass-card">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white">
                    RISE <span class="text-[#FF4157]">VAULT</span>
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-[10px] font-black opacity-40 uppercase tracking-widest text-white">Helotes, TX</span>
                    <div class="flex items-center gap-1 text-[10px] font-black text-[#FF4157] bg-[#FF4157]/10 px-2 py-0.5 rounded-full">
                        <i data-lucide="wind" style="width: 12px; height: 12px;"></i> 48°F
                    </div>
                </div>
            </div>
            <button id="role-toggle-btn" onclick="toggleRole()" class="px-4 py-2 rounded-2xl border transition-all flex items-center gap-2 text-[10px] font-black uppercase tracking-widest bg-white/5 border-white/10 text-white opacity-60">
                <i id="role-icon" data-lucide="lock" style="width: 12px; height: 12px;"></i>
                <span id="role-text">Volunteer</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main id="main-content" class="px-6 py-8 space-y-8 max-w-lg mx-auto">
        <!-- Views are injected here -->
    </main>

    <!-- NAVIGATION BAR -->
    <nav class="fixed bottom-8 left-6 right-6 h-20 glass-card rounded-[30px] flex items-center justify-around z-50 shadow-2xl px-2 max-w-lg mx-auto bg-slate-900/90">
        <button onclick="changeView('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500">
            <i data-lucide="home" style="width: 20px; height: 20px;"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Core</span>
        </button>
        <button onclick="changeView('inventory')" id="nav-inventory" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500">
            <i data-lucide="layers" style="width: 20px; height: 20px;"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Vault</span>
        </button>
        <button onclick="changeView('orders')" id="nav-orders" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500">
            <i data-lucide="shopping-cart" style="width: 20px; height: 20px;"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">List</span>
        </button>
        <button onclick="changeView('trends')" id="nav-trends" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500">
            <i data-lucide="activity" style="width: 20px; height: 20px;"></i>
            <span class="text-[8px] font-black uppercase tracking-widest">Data</span>
        </button>
    </nav>

    <!-- AUTH MODAL (PASSCODE: 1234) -->
    <div id="auth-modal" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex items-center justify-center p-8">
        <div class="w-full max-w-xs glass-card rounded-[48px] p-10 relative text-center border border-white/10">
            <button onclick="closeAuthModal()" class="absolute top-8 right-8 text-white/30"><i data-lucide="x"></i></button>
            <div class="w-16 h-16 bg-[#FF4157]/10 rounded-[24px] flex items-center justify-center text-[#FF4157] mb-6 mx-auto"><i data-lucide="key-round"></i></div>
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-6 leading-tight">Lead Access</h2>
            <input id="passcode-field" type="password" maxlength="4" placeholder="••••" class="w-full text-center text-4xl font-black tracking-[0.4em] bg-white/5 py-6 rounded-[24px] outline-none border border-white/10 text-[#FF4157] mb-6">
            <button onclick="checkPasscode()" class="w-full py-5 rounded-[20px] bg-[#FF4157] text-white font-black uppercase text-[10px] tracking-[0.3em]">Unlock</button>
        </div>
    </div>

    <script>
        // --- APP STATE ---
        let currentView = 'home';
        let isAdmin = false;
        let attendance = 342;
        
        let inventory = [
            { id: 1, name: "Texas Pecan", stock: 2, unit: "Boxes", category: "Coffee", price: 72.50, url: "https://amazon.com" },
            { id: 2, name: "High Speed", stock: 4, unit: "Boxes", category: "Coffee", price: 84.00, url: "https://amazon.com" },
            { id: 3, name: "Vanilla Creamer", stock: 1, unit: "Cases", category: "Creamer", price: 34.20, url: "https://amazon.com" },
            { id: 4, name: "12oz Cups", stock: 0, unit: "Sleeves", category: "Paper", price: 45.00, url: "https://amazon.com" }
        ];

        // --- CORE FUNCTIONS ---
        function changeView(view) {
            currentView = view;
            render();
        }

        function toggleRole() {
            if (isAdmin) {
                isAdmin = false;
                render();
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('passcode-field').focus();
            }
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('passcode-field').value = '';
        }

        function checkPasscode() {
            const val = document.getElementById('passcode-field').value;
            if (val === '1234') {
                isAdmin = true;
                closeAuthModal();
                render();
            } else {
                document.getElementById('passcode-field').value = '';
                alert("Incorrect Passcode");
            }
        }

        function updateStock(id, delta) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.stock = Math.max(0, item.stock + delta);
                render();
            }
        }

        function updateAttendance(delta) {
            attendance = Math.max(0, attendance + delta);
            render();
        }

        // --- UI RENDERER ---
        function render() {
            const content = document.getElementById('main-content');
            
            // Update Navigation Buttons
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `nav-${currentView}`) btn.classList.add('active');
            });

            // Update Role Toggle Button
            const roleBtn = document.getElementById('role-toggle-btn');
            const roleText = document.getElementById('role-text');
            if (isAdmin) {
                roleBtn.classList.add('bg-[#FF4157]', 'border-[#FF4157]', 'text-white', 'opacity-100');
                roleText.innerText = "Lead";
            } else {
                roleBtn.classList.remove('bg-[#FF4157]', 'border-[#FF4157]', 'text-white', 'opacity-100');
                roleText.innerText = "Volunteer";
            }

            // Render Content based on view
            let html = `<div class="view-content space-y-6">`;

            if (currentView === 'home') {
                html += `
                    <div class="p-8 rounded-[40px] glass-card text-center border-2 border-[#FF4157]/20">
                        <p class="text-[10px] font-black text-[#FF4157] uppercase tracking-[0.4em] mb-4">Service Attendance</p>
                        <h2 class="text-6xl font-black mb-6 tracking-tighter">${attendance}</h2>
                        <div class="flex gap-4">
                            <button onclick="updateAttendance(-1)" class="flex-1 h-16 rounded-3xl bg-white/5 flex items-center justify-center border border-white/5 active:bg-white/10"><i data-lucide="minus"></i></button>
                            <button onclick="updateAttendance(1)" class="flex-[2] h-16 rounded-3xl bg-[#FF4157] text-white flex items-center justify-center shadow-lg shadow-[#FF4157]/20 active:opacity-80"><i data-lucide="users" class="mr-2"></i> GUEST</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="p-6 rounded-[32px] glass-card flex flex-col items-center gap-2">
                            <p class="text-[9px] font-black opacity-30 uppercase tracking-widest">Lead Ops</p>
                            <button onclick="${isAdmin ? 'alert(\'Feature coming soon!\')' : 'toggleRole()'}" class="w-full py-4 rounded-2xl bg-white/5 border border-white/5 text-[10px] font-black uppercase">${isAdmin ? 'Add Asset' : 'Unlock'}</button>
                        </div>
                        <div class="p-6 rounded-[32px] glass-card flex flex-col items-center gap-2">
                            <p class="text-[9px] font-black opacity-30 uppercase tracking-widest">Vault Status</p>
                            <span class="text-sm font-black text-[#FF4157]">Healthy</span>
                        </div>
                    </div>
                `;
            } else if (currentView === 'inventory') {
                html += `<h2 class="text-2xl font-black uppercase tracking-tighter px-2">Vault Assets</h2>`;
                inventory.forEach(item => {
                    html += `
                        <div class="p-6 rounded-[32px] glass-card">
                            <div class="flex justify-between items-center mb-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-2xl bg-[#FF4157]/10 text-[#FF4157] flex items-center justify-center"><i data-lucide="package"></i></div>
                                    <div>
                                        <p class="text-sm font-black uppercase">${item.name}</p>
                                        <p class="text-[10px] font-bold opacity-30 uppercase">${item.category}</p>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-black">${item.stock}</p>
                                    <p class="text-[9px] font-bold opacity-30 uppercase">${item.unit}</p>
                                </div>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="updateStock(${item.id}, -1)" class="flex-1 h-12 rounded-xl bg-white/5 flex items-center justify-center active:bg-white/10"><i data-lucide="minus"></i></button>
                                <button onclick="updateStock(${item.id}, 1)" class="flex-1 h-12 rounded-xl bg-[#FF4157] text-white flex items-center justify-center active:opacity-80"><i data-lucide="plus"></i></button>
                            </div>
                        </div>
                    `;
                });
            } else if (currentView === 'orders') {
                html += `<h2 class="text-2xl font-black uppercase tracking-tighter px-2">Purchase List</h2>`;
                const lowItems = inventory.filter(i => i.stock <= 1);
                if (lowItems.length === 0) {
                    html += `<div class="p-12 text-center opacity-30 uppercase font-black text-xs">All Stocked</div>`;
                } else {
                    lowItems.forEach(item => {
                        html += `
                            <div class="flex gap-3">
                                <a href="${item.url}" target="_blank" class="flex-1 p-6 rounded-[32px] glass-card border-l-4 border-l-[#FF4157] flex justify-between items-center active:scale-[0.98]">
                                    <div>
                                        <p class="text-sm font-black uppercase">${item.name}</p>
                                        <p class="text-[10px] font-black text-[#FF4157] uppercase mt-1">Order Now <i data-lucide="external-link" class="w-2.5 h-2.5 inline-block"></i></p>
                                    </div>
                                    <span class="text-xs font-black opacity-30">$${item.price.toFixed(2)}</span>
                                </a>
                                <button onclick="updateStock(${item.id}, 1)" class="w-16 h-16 rounded-[24px] bg-white/5 flex items-center justify-center text-[#FF4157]"><i data-lucide="check"></i></button>
                            </div>
                        `;
                    });
                }
            } else if (currentView === 'trends') {
                html += `
                    <h2 class="text-2xl font-black uppercase tracking-tighter px-2">Data Matrix</h2>
                    <div class="p-8 rounded-[40px] glass-card h-64 flex flex-col justify-end gap-4">
                        <div class="flex items-end justify-between h-32 gap-2">
                            <div class="bg-[#FF4157] w-full rounded-t-lg" style="height: 40%"></div>
                            <div class="bg-[#FF4157] w-full rounded-t-lg" style="height: 60%"></div>
                            <div class="bg-[#FF4157] w-full rounded-t-lg" style="height: 55%"></div>
                            <div class="bg-[#FF4157] w-full rounded-t-lg" style="height: 90%"></div>
                        </div>
                        <div class="flex justify-between text-[8px] font-black opacity-30 uppercase tracking-widest">
                            <span>Sun 1</span><span>Sun 2</span><span>Sun 3</span><span>Sun 4</span>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            content.innerHTML = html;
            
            // Re-initialize icons every time we render
            lucide.createIcons();
        }

        // Initialize App on Load
        window.onload = () => {
            render();
            lucide.createIcons();
        };
    </script>
</body>
</html>

```
