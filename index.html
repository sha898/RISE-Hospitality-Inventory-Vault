```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rise Hospitality Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --accent: #FF4157;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617; /* slate-950 */
            color: white;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .animate-toast {
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .text-accent { color: var(--accent); }
        .bg-accent { background-color: var(--accent); }
        .border-accent { border-color: var(--accent); }
        
        .nav-active {
            color: var(--accent) !important;
        }
        
        .nav-active i {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="pb-32">

    <div id="app" class="min-h-screen">
        
        <!-- HEADER -->
        <header class="sticky top-0 z-50 px-6 py-6 border-b glass-card border-white/5 bg-slate-950/60">
            <div class="flex justify-between items-center max-w-lg mx-auto">
                <div>
                    <h1 class="text-2xl font-black tracking-tighter text-white">
                        RISE <span class="text-accent">VAULT</span>
                    </h1>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] font-black opacity-40 uppercase tracking-widest text-white">Helotes, TX</span>
                        <div class="flex items-center gap-1 text-[10px] font-black text-accent bg-accent/10 px-2 py-0.5 rounded-full">
                            <i data-lucide="wind" class="w-3 h-3"></i> 48°F
                        </div>
                    </div>
                </div>
                <button id="role-toggle" onclick="handleRoleToggle()" class="px-4 py-2 rounded-2xl border transition-all flex items-center gap-2 text-[10px] font-black uppercase tracking-widest bg-white/5 border-white/10 text-white opacity-60">
                    <i data-lucide="lock" class="w-3 h-3"></i>
                    <span id="role-label">Volunteer</span>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="px-6 py-8 space-y-8 max-w-lg mx-auto" id="main-content">
            <!-- Content Injected via render() -->
        </main>

        <!-- FOOTER NAV -->
        <nav class="fixed bottom-8 left-6 right-6 h-20 glass-card rounded-[30px] flex items-center justify-around z-50 shadow-2xl px-2 border border-white/10 bg-slate-900/90 max-w-lg mx-auto">
            <button onclick="setView('home')" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500" id="nav-home">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">Core</span>
            </button>
            <button onclick="setView('inventory')" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500" id="nav-inventory">
                <i data-lucide="layers" class="w-5 h-5"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">Vault</span>
            </button>
            <button onclick="setView('orders')" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500" id="nav-orders">
                <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">List</span>
            </button>
            <button onclick="setView('trends')" class="nav-btn flex flex-col items-center gap-1.5 flex-1 transition-all text-slate-500" id="nav-trends">
                <i data-lucide="activity" class="w-5 h-5"></i>
                <span class="text-[8px] font-black uppercase tracking-widest">Data</span>
            </button>
        </nav>

        <!-- AUTH MODAL -->
        <div id="auth-modal" class="hidden fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex items-center justify-center p-8">
            <div class="w-full max-w-xs glass-card rounded-[48px] p-10 relative text-center bg-slate-900/50 border border-white/10">
                <button onclick="toggleAuthModal()" class="absolute top-8 right-8 text-white opacity-30"><i data-lucide="x"></i></button>
                <div class="w-16 h-16 bg-accent/10 rounded-[24px] flex items-center justify-center text-accent mb-6 mx-auto"><i data-lucide="key-round" class="w-8 h-8"></i></div>
                <h2 class="text-2xl font-black uppercase tracking-tighter mb-6 text-white leading-tight">Lead<br>Authorization</h2>
                <input id="passcode-input" type="password" maxlength="4" placeholder="••••" class="w-full text-center text-4xl font-black tracking-[0.4em] bg-white/5 py-6 rounded-[24px] outline-none border border-white/10 text-accent mb-6">
                <button onclick="verifyPasscode()" class="w-full py-5 rounded-[20px] bg-accent text-white font-black uppercase text-[10px] tracking-[0.3em]">Unlock Vault</button>
            </div>
        </div>

        <!-- ADD ITEM MODAL -->
        <div id="add-modal" class="hidden fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-8">
            <div class="w-full max-w-sm glass-card rounded-[40px] p-8 space-y-5 bg-slate-900 border border-white/10 text-white">
               <h2 class="text-2xl font-black uppercase tracking-tighter">Add to Vault</h2>
               <div class="space-y-3">
                  <input id="new-name" placeholder="Item Name" class="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/5 focus:border-accent">
                  <div class="grid grid-cols-2 gap-3">
                     <select id="new-category" class="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/5 text-white">
                        <option value="Coffee">Coffee</option>
                        <option value="Creamer">Creamer</option>
                        <option value="Sweetener">Sweetener</option>
                        <option value="Paper">Paper/Cups</option>
                        <option value="Misc">Misc</option>
                     </select>
                     <select id="new-unit" class="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/5 text-white">
                        <option value="Boxes">Boxes</option>
                        <option value="Cases">Cases</option>
                        <option value="Units">Units</option>
                        <option value="Sleeves">Sleeves</option>
                        <option value="Packs">Packs</option>
                     </select>
                  </div>
                  <input id="new-price" type="number" step="0.01" placeholder="Price ($)" class="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/5">
                  <input id="new-url" type="url" placeholder="Purchase URL" class="w-full p-4 bg-white/5 rounded-2xl outline-none border border-white/5 text-xs">
               </div>
               <div class="flex gap-4">
                  <button onclick="toggleAddModal()" class="flex-1 py-5 rounded-2xl bg-white/5 font-black uppercase text-[10px]">Cancel</button>
                  <button onclick="addItem()" class="flex-1 py-5 rounded-2xl bg-accent text-white font-black uppercase text-[10px]">Confirm</button>
               </div>
            </div>
        </div>

        <!-- TOAST -->
        <div id="toast" class="hidden fixed top-28 left-1/2 -translate-x-1/2 z-[200] bg-accent text-white px-8 py-5 rounded-[24px] shadow-2xl flex items-center gap-4 animate-toast">
            <i data-lucide="check" class="w-4 h-4"></i>
            <p class="text-[10px] font-black uppercase tracking-widest leading-none" id="toast-text">Success</p>
        </div>
    </div>

    <script>
        // --- DATA ---
        let currentView = 'home';
        let userRole = 'Volunteer';
        let guestCount = 342;
        let editingPriceId = null;

        let inventory = [
            { id: '1', name: "Texas Pecan", stock: 2, unit: "Boxes", category: "Coffee", threshold: 1, price: 72.50, url: "https://www.amazon.com/s?k=pecan+coffee" },
            { id: '2', name: "High Speed", stock: 4, unit: "Boxes", category: "Coffee", threshold: 1, price: 84.00, url: "https://www.amazon.com/s?k=high+speed+coffee" },
            { id: '3', name: "Decaf Coffee", stock: 2, unit: "Boxes", category: "Coffee", threshold: 1, price: 68.00, url: "https://www.amazon.com/s?k=decaf+coffee" },
            { id: '4', name: "Vanilla Creamer", stock: 5, unit: "Cases", category: "Creamer", threshold: 2, price: 34.20, url: "https://www.amazon.com/s?k=vanilla+creamer+pods" },
            { id: '7', name: "Coffee Cups (12oz)", stock: 1, unit: "Sleeves", category: "Paper", threshold: 2, price: 45.00, url: "https://www.amazon.com/s?k=12oz+coffee+cups" },
            { id: '8', name: "Coffee Sleeves", stock: 6, unit: "Sleeves", category: "Paper", threshold: 2, price: 28.00, url: "https://www.amazon.com/s?k=coffee+sleeves" }
        ];

        const historyData = [
            { day: 'Sun 1', guests: 342, usage: 45 },
            { day: 'Sun 2', guests: 412, usage: 60 },
            { day: 'Sun 3', guests: 388, usage: 35 },
            { day: 'Sun 4', guests: 520, usage: 90 }
        ];

        // --- CORE LOGIC ---
        function setView(view) {
            currentView = view;
            render();
        }

        function handleRoleToggle() {
            if (userRole === 'Lead') {
                userRole = 'Volunteer';
                showToast("Volunteer Mode");
                render();
            } else {
                toggleAuthModal();
            }
        }

        function toggleAuthModal() {
            const modal = document.getElementById('auth-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('passcode-input').focus();
            }
        }

        function verifyPasscode() {
            const input = document.getElementById('passcode-input');
            if (input.value === '1234') {
                userRole = 'Lead';
                toggleAuthModal();
                input.value = '';
                showToast("Access Granted");
                render();
            } else {
                input.value = '';
                showToast("Incorrect Code");
            }
        }

        function updateStock(id, delta) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                item.stock = Math.max(0, item.stock + delta);
                render();
            }
        }

        function startEditingPrice(id) {
            if (userRole !== 'Lead') {
                showToast("Leads Only");
                return;
            }
            editingPriceId = id;
            render();
            setTimeout(() => document.getElementById('editing-p')?.focus(), 50);
        }

        function savePrice(id, val) {
            const num = parseFloat(val);
            if (!isNaN(num)) {
                const item = inventory.find(i => i.id === id);
                if (item) item.price = num;
            }
            editingPriceId = null;
            render();
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        }

        function toggleAddModal() {
            if (userRole !== 'Lead') {
                showToast("Leads Only");
                return;
            }
            document.getElementById('add-modal').classList.toggle('hidden');
        }

        function addItem() {
            const name = document.getElementById('new-name').value;
            const price = document.getElementById('new-price').value;
            const category = document.getElementById('new-category').value;
            const unit = document.getElementById('new-unit').value;
            const url = document.getElementById('new-url').value;
            
            if (name) {
                inventory.push({
                    id: Date.now().toString(),
                    name,
                    stock: 0,
                    unit,
                    category,
                    threshold: 1,
                    price: parseFloat(price) || 0,
                    url: url || "https://amazon.com"
                });
                
                document.getElementById('new-name').value = '';
                document.getElementById('new-price').value = '';
                document.getElementById('new-url').value = '';
                
                toggleAddModal();
                showToast("Added to Vault");
                render();
            }
        }

        function getCategoryIcon(cat) {
            switch(cat) {
                case 'Coffee': return 'coffee';
                case 'Creamer': return 'droplets';
                case 'Paper': return 'scroll';
                case 'Sweetener': return 'sugar';
                default: return 'package';
            }
        }

        // --- RENDERER ---
        function render() {
            const main = document.getElementById('main-content');
            const lowItems = inventory.filter(i => i.stock <= i.threshold);
            
            // Update Role UI
            const roleBtn = document.getElementById('role-toggle');
            if (userRole === 'Lead') {
                roleBtn.className = "px-4 py-2 rounded-2xl border transition-all flex items-center gap-2 text-[10px] font-black uppercase tracking-widest bg-accent text-white border-accent";
                roleBtn.querySelector('i').setAttribute('data-lucide', 'unlock');
            } else {
                roleBtn.className = "px-4 py-2 rounded-2xl border transition-all flex items-center gap-2 text-[10px] font-black uppercase tracking-widest bg-white/5 border-white/10 text-white opacity-60";
                roleBtn.querySelector('i').setAttribute('data-lucide', 'lock');
            }
            document.getElementById('role-label').innerText = userRole;

            // Update Nav UI
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('nav-active', btn.id === `nav-${currentView}`);
            });

            let html = '';

            if (currentView === 'home') {
                html = `
                    <div class="space-y-6 animate-in slide-in-from-bottom-4 duration-300">
                        <div class="p-8 rounded-[40px] glass-card text-center bg-slate-900/40 border-2 border-accent/20">
                            <p class="text-[10px] font-black text-accent uppercase tracking-[0.4em] mb-4">Service Attendance</p>
                            <h2 class="text-6xl font-black mb-6 tracking-tighter">${guestCount}</h2>
                            <div class="flex gap-4">
                                <button onclick="guestCount=Math.max(0, guestCount-1); render()" class="flex-1 h-16 rounded-3xl bg-white/5 flex items-center justify-center border border-white/5"><i data-lucide="minus"></i></button>
                                <button onclick="guestCount++; render()" class="flex-[2] h-16 rounded-3xl bg-accent text-white flex items-center justify-center shadow-lg shadow-accent/20"><i data-lucide="users" class="mr-2 w-4 h-4"></i> GUEST</button>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-xs font-black uppercase tracking-[0.2em] opacity-40 px-2 text-white">Vault Settings</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <button onclick="toggleAddModal()" class="p-6 rounded-[32px] glass-card bg-slate-900 border border-white/5 flex flex-col items-center gap-3 active:scale-95 transition-transform">
                                    <div class="w-12 h-12 rounded-2xl bg-accent/10 text-accent flex items-center justify-center"><i data-lucide="plus-circle"></i></div>
                                    <span class="text-[10px] font-black uppercase tracking-widest">New Asset</span>
                                </button>
                                <button onclick="setView('inventory')" class="p-6 rounded-[32px] glass-card bg-slate-900 border border-white/5 flex flex-col items-center gap-3 active:scale-95 transition-transform">
                                    <div class="w-12 h-12 rounded-2xl bg-white/5 text-white/40 flex items-center justify-center"><i data-lucide="edit-3"></i></div>
                                    <span class="text-[10px] font-black uppercase tracking-widest">Manage All</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'inventory') {
                html = `
                    <div class="space-y-6 animate-in slide-in-from-right-4 duration-300">
                        <div class="flex justify-between items-center px-2">
                            <h2 class="text-2xl font-black uppercase tracking-tighter">Vault Assets</h2>
                            <button onclick="toggleAddModal()" class="w-10 h-10 bg-accent rounded-xl text-white flex items-center justify-center">
                                <i data-lucide="plus" class="w-5 h-5"></i>
                            </button>
                        </div>
                        
                        <div class="space-y-4">
                            ${inventory.map(item => {
                                const isLow = item.stock <= item.threshold;
                                return `
                                    <div class="p-6 rounded-[32px] glass-card bg-slate-900/40 border border-white/5">
                                        <div class="flex justify-between items-start mb-6">
                                            <div class="flex gap-4">
                                                <div class="w-14 h-14 rounded-[20px] ${isLow ? 'bg-red-500/10 text-red-500' : 'bg-accent/10 text-accent'} flex items-center justify-center">
                                                    <i data-lucide="${getCategoryIcon(item.category)}"></i>
                                                </div>
                                                <div>
                                                    <p class="text-sm font-black uppercase tracking-tight text-white">${item.name}</p>
                                                    <div class="mt-1" onclick="startEditingPrice('${item.id}')">
                                                        ${editingPriceId === item.id ? `
                                                            <div class="flex items-center bg-white/10 rounded-lg px-2 py-1">
                                                                <span class="text-accent text-[10px] font-black mr-1">$</span>
                                                                <input id="editing-p" type="number" step="0.01" class="bg-transparent text-accent text-[10px] font-black outline-none w-16" value="${item.price}" onblur="savePrice('${item.id}', this.value)" onkeydown="if(event.key==='Enter') this.blur()">
                                                            </div>
                                                        ` : `
                                                            <p class="text-[10px] font-black text-accent uppercase tracking-widest cursor-pointer hover:bg-white/5 px-2 py-1 rounded inline-block transition-all">
                                                                $${item.price.toFixed(2)} <i data-lucide="edit-2" class="w-2 h-2 inline-block ml-1 opacity-30"></i>
                                                            </p>
                                                        `}
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="text-right">
                                                <p class="text-2xl font-black ${isLow ? 'text-red-500' : 'text-white'}">${item.stock}</p>
                                                <p class="text-[9px] font-bold opacity-30 uppercase tracking-tighter">${item.unit}</p>
                                            </div>
                                        </div>
                                        <div class="flex gap-3">
                                            <button onclick="updateStock('${item.id}', -1)" class="flex-1 h-14 rounded-2xl bg-white/5 flex items-center justify-center border border-white/5 active:bg-white/10 transition-colors"><i data-lucide="minus"></i></button>
                                            <button onclick="updateStock('${item.id}', 1)" class="flex-1 h-14 rounded-2xl bg-accent text-white flex items-center justify-center active:opacity-80 transition-opacity shadow-lg shadow-accent/10"><i data-lucide="plus"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (currentView === 'trends') {
                html = `
                    <div class="space-y-6 animate-in slide-in-from-left-4 duration-300">
                        <h2 class="text-2xl font-black uppercase tracking-tighter px-2">Data Matrix</h2>
                        <div class="p-8 rounded-[40px] glass-card bg-slate-900/40 border border-white/5 relative">
                            <p class="text-[10px] font-black opacity-30 uppercase tracking-[0.2em] mb-8">Supply Consumption Trend</p>
                            
                            <div class="relative h-48 w-full">
                                <svg class="w-full h-full overflow-visible" preserveAspectRatio="none" viewBox="0 0 400 100">
                                    <path d="M ${historyData.map((d, i) => `${i * 133} ${100 - d.usage}`).join(' L ')}" 
                                          fill="none" stroke="#FF4157" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                                    ${historyData.map((d, i) => `<circle cx="${i * 133}" cy="${100 - d.usage}" r="6" fill="#FF4157" />`).join('')}
                                </svg>
                                <div class="flex justify-between w-full mt-6">
                                    ${historyData.map(d => `<span class="text-[8px] font-black opacity-30 uppercase">${d.day}</span>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="bg-white/5 rounded-3xl p-6 border border-white/5">
                             <div class="flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] font-black opacity-30 uppercase mb-1">Avg Guest Count</p>
                                    <p class="text-2xl font-black">415</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-[10px] font-black text-accent uppercase mb-1">Status</p>
                                    <p class="text-xs font-bold uppercase">Optimal</p>
                                </div>
                             </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'orders') {
                html = `
                    <div class="space-y-6 animate-in slide-in-from-top-4 duration-300">
                        <div class="px-2">
                            <h2 class="text-2xl font-black uppercase tracking-tighter">Purchase List</h2>
                            <p class="text-[10px] font-black opacity-40 uppercase tracking-widest mt-1">Direct Procurement Links</p>
                        </div>
                        ${lowItems.length === 0 ? `
                            <div class="p-20 text-center glass-card rounded-[40px] border-2 border-dashed border-white/10 bg-slate-900/20">
                                <i data-lucide="smile" class="w-12 h-12 mx-auto mb-4 text-accent opacity-20"></i>
                                <p class="text-xs font-black uppercase tracking-[0.3em] opacity-40">Vault Saturated</p>
                            </div>
                        ` : lowItems.map(item => `
                            <div class="flex items-center gap-3">
                                <a href="${item.url}" target="_blank" class="flex-1 p-6 rounded-[32px] glass-card bg-slate-900/40 border-l-4 border-l-accent border-white/5 flex justify-between items-center active:scale-95 transition-all">
                                    <div>
                                        <p class="text-sm font-black uppercase text-white tracking-tight">${item.name}</p>
                                        <p class="text-[10px] font-black text-accent uppercase mt-1 flex items-center gap-1">Order Now <i data-lucide="external-link" class="w-3 h-3"></i></p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm font-black text-white/40">$${item.price.toFixed(2)}</p>
                                        <p class="text-[9px] font-black text-red-500 uppercase">${item.stock} left</p>
                                    </div>
                                </a>
                                <button onclick="updateStock('${item.id}', 1)" class="w-16 h-16 bg-white/5 rounded-[24px] border border-white/5 flex items-center justify-center text-accent active:bg-accent/10 transition-colors">
                                    <i data-lucide="plus-square"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            main.innerHTML = html;
            lucide.createIcons();
        }

        // Initialize on load
        window.onload = render;
    </script>
</body>
</html>

```
